name: 📜 | Check with Stylua

permissions:
    contents: read
    pull-requests: write

on:
    workflow_dispatch:
    pull_request:
        # paths:
        #     - "**.lua"

jobs:
    styling:
        name: Lua Style Check with Stylua
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: 76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                version: 2.4.0
                args: .
            - name: Reviewdog suggester
              uses: reviewdog/action-suggester@v1
              with:
                tool_name: stylua
                fail_on_error: true
